
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 편의점 타이쿤</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
}
#hud {
  position:fixed;
  top:15px;
  left:15px;
  z-index:5;
  background:#111d;
  padding:14px;
  border-radius:12px;
  line-height:1.8;
}
#message {
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:#111e;
  padding:14px 22px;
  border-radius:10px;
  z-index:5;
  min-width:240px;
  text-align:center;
}
#crosshair {
  position:fixed;
  top:50%;
  left:50%;
  width:10px;
  height:10px;
  border:2px solid white;
  border-radius:50%;
  transform:translate(-50%,-50%);
  z-index:4;
}
#help {
  position:fixed;
  bottom:15px;
  left:15px;
  background:#111c;
  padding:10px;
  border-radius:8px;
  z-index:5;
  font-size:13px;
}
#start {
  position:fixed;
  inset:0;
  z-index:10;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#101820;
  text-align:center;
}
button {
  padding:14px 30px;
  border:0;
  border-radius:9px;
  background:#16a36a;
  color:white;
  font-weight:bold;
  cursor:pointer;
  font-size:17px;
}
#terminal {
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:5;
  width:190px;
  background:#222;
  border:4px solid #555;
  border-radius:12px;
  padding:12px;
  text-align:center;
}
#terminalScreen {
  background:#9bdda5;
  color:#102b18;
  min-height:65px;
  padding:10px;
  border-radius:5px;
  font-weight:bold;
  margin-bottom:10px;
}
</style>
</head>
<body>

<div id="start">
  <h1>🏪 3D 편의점 타이쿤</h1>
  <p>직접 편의점을 운영하고 손님을 계산해 주세요!</p>
  <button id="startButton">게임 시작</button>
  <p>WASD 이동 / 마우스 시점 / E 상호작용</p>
</div>

<div id="hud">
  💰 잔액: <span id="money">50000</span>원<br>
  🛒 판매 상품: <span id="sold">0</span>개<br>
  👥 손님: <span id="customers">0</span>명
</div>

<div id="crosshair"></div>
<div id="message">게임을 시작해 주세요.</div>

<div id="help">
  WASD 이동 | 마우스 시점<br>
  E 상호작용 | ESC 마우스 해제
</div>

<div id="terminal">
  <div>💳 CARD TERMINAL</div>
  <div id="terminalScreen">결제 대기 중</div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bc8e8);
scene.fog = new THREE.Fog(0x9bc8e8, 15, 45);

const camera = new THREE.PerspectiveCamera(
  75, innerWidth/innerHeight, 0.1, 1000
);
camera.position.set(0,1.7,7);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x667788,2));

const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(5,10,5);
sun.castShadow = true;
scene.add(sun);

const materials = {
  floor:new THREE.MeshStandardMaterial({color:0xb9b9b9}),
  wall:new THREE.MeshStandardMaterial({color:0xf1eee5}),
  shelf:new THREE.MeshStandardMaterial({color:0x8b542e}),
  counter:new THREE.MeshStandardMaterial({color:0x383838}),
  red:new THREE.MeshStandardMaterial({color:0xd94343}),
  blue:new THREE.MeshStandardMaterial({color:0x2876d2}),
  green:new THREE.MeshStandardMaterial({color:0x32a65b}),
  yellow:new THREE.MeshStandardMaterial({color:0xf1c232})
};

function cube(x,y,z,w,h,d,mat) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),mat
  );
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  scene.add(mesh);
  return mesh;
}

// 바닥
cube(0,-0.15,0,20,0.3,20,materials.floor);

// 벽
cube(0,2,-10,20,4,0.3,materials.wall);
cube(-10,2,0,0.3,4,20,materials.wall);
cube(10,2,0,0.3,4,20,materials.wall);

// 천장 조명
for(let x=-6;x<=6;x+=4){
  const light=new THREE.PointLight(0xffffff,35,10);
  light.position.set(x,3.7,0);
  scene.add(light);
  cube(x,3.9,0,1.5,0.08,0.5,
    new THREE.MeshStandardMaterial({color:0xffffff}));
}

// 선반 만들기
const products=[];
const productColors=[materials.red,materials.blue,
  materials.green,materials.yellow];

for(let z=-5;z<=2;z+=3){
  cube(-3,0.9,z,1.5,1.8,2,materials.shelf);
  cube(-3,1.5,z,1.6,0.08,2.1,materials.counter);
  cube(-3,0.9,z,1.6,0.08,2.1,materials.counter);

  for(let i=0;i<4;i++){
    const p=cube(
      -3.4+(i%2)*0.7,
      1.05+Math.floor(i/2)*0.55,
      z-0.45,
      0.35,0.4,0.35,
      productColors[i]
    );
    products.push(p);
  }
}

// 계산대
cube(1,0.55,-3,3,1.1,1.5,materials.counter);

// 스캐너
const scanner=cube(1,1.15,-3,0.55,0.15,0.5,
  new THREE.MeshStandardMaterial({color:0x222222}));

// 카드 단말기
const terminal=cube(2,1.1,-3,0.55,0.25,0.5,
  new THREE.MeshStandardMaterial({color:0x171717}));

// 카드 삽입구
cube(2,1.24,-3.05,0.25,0.02,0.03,
  new THREE.MeshStandardMaterial({color:0xaaaaaa}));

// 창고
cube(7,1,-7,2,2,2,materials.shelf);

// 출입문 표시
cube(0,1.5,9.8,3,3,0.15,
  new THREE.MeshStandardMaterial({
    color:0x5b9ebc,transparent:true,opacity:0.5
  }));

// 플레이어
const player={
  position:new THREE.Vector3(0,1.7,7),
  yaw:0,
  pitch:0
};

camera.position.copy(player.position);

const keys={};
let money=50000;
let sold=0;
let customers=[];
let currentCustomer=null;
let scanned=0;
let total=0;
let gameStarted=false;
let busy=false;

const moneyUI=document.getElementById('money');
const soldUI=document.getElementById('sold');
const customerUI=document.getElementById('customers');
const message=document.getElementById('message');
const terminalScreen=document.getElementById('terminalScreen');

function say(text){
  message.textContent=text;
}

function updateHUD(){
  moneyUI.textContent=money.toLocaleString();
  soldUI.textContent=sold;
  customerUI.textContent=customers.length;
}

function makeCustomer(){
  if(customers.length>=2) return;

  const group=new THREE.Group();
  const body=new THREE.Mesh(
    new THREE.CylinderGeometry(0.28,0.35,1,8),
    new THREE.MeshStandardMaterial({color:0x2678bd})
  );
  body.position.y=0.85;
  group.add(body);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(0.23,12,12),
    new THREE.MeshStandardMaterial({color:0xffcc99})
  );
  head.position.y=1.5;
  group.add(head);

  group.position.set(
    Math.random()*2-1,0,8
  );
  scene.add(group);

  customers.push({
    group,
    state:'enter',
    count:Math.floor(Math.random()*3)+1
  });
  updateHUD();
}

function spawnCustomer(){
  if(!gameStarted) return;
  makeCustomer();
}

function activeCustomer(){
  return customers.find(c=>c.state==='checkout');
}

function scanProduct(){
  if(!currentCustomer || busy) return;

  if(scanned>=currentCustomer.count){
    say('모든 상품을 스캔했어요. 결제를 진행하세요.');
    return;
  }

  scanned++;
  total+=Math.floor(Math.random()*3000)+1000;

  terminalScreen.innerHTML=
    '상품 '+scanned+'개<br>'+total.toLocaleString()+'원';

  say('삑! 상품을 스캔했습니다. ('+
    scanned+'/'+currentCustomer.count+')');
}

function pay(){
  if(!currentCustomer || busy) return;

  if(scanned<currentCustomer.count){
    say('아직 스캔하지 않은 상품이 있어요!');
    return;
  }

  busy=true;
  terminalScreen.textContent='카드 삽입 중...';

  // 손님이 단말기에 카드를 꽂는 연출
  const card=cube(2,1.35,-3,
    0.25,0.03,0.35,
    new THREE.MeshStandardMaterial({color:0x2859c7})
  );

  let step=0;
  const interval=setInterval(()=>{
    step++;
    card.position.y-=0.045;
    if(step>=5){
      clearInterval(interval);
      scene.remove(card);
      terminalScreen.textContent='승인 중...';

      setTimeout(()=>{
        money+=total;
        sold+=scanned;
        updateHUD();
        terminalScreen.textContent='결제 완료!';
        say('결제 성공! +'+total.toLocaleString()+'원');

        currentCustomer.state='leave';
        currentCustomer=null;
        scanned=0;
        total=0;
        busy=false;

        setTimeout(()=>{
          terminalScreen.textContent='결제 대기 중';
        },2000);
      },1800);
    }
  },100);
}

function interact(){
  if(busy) return;

  const customer=activeCustomer();

  if(customer){
    if(scanned<customer.count){
      scanProduct();
    }else{
      pay();
    }
    return;
  }

  say('계산대 근처에서 손님을 기다려 주세요.');
}

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;

  if(e.key.toLowerCase()==='e'){
    interact();
  }

  if(e.key.toLowerCase()==='f'){
    scanProduct();
  }

  if(e.key.toLowerCase()==='g'){
    pay();
  }
});

document.addEventListener('keyup',e=>{
  keys[e.key.toLowerCase()]=false;
});

// 마우스 시점
document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement!==renderer.domElement) return;

  player.yaw-=e.movementX*0.002;
  player.pitch-=e.movementY*0.002;
  player.pitch=Math.max(-1.3,Math.min(1.3,player.pitch));
});

renderer.domElement.addEventListener('click',()=>{
  if(gameStarted && !document.pointerLockElement){
    renderer.domElement.requestPointerLock();
  }
});

document.getElementById('startButton').onclick=()=>{
  document.getElementById('start').style.display='none';
  gameStarted=true;
  renderer.domElement.requestPointerLock();
  say('편의점 운영을 시작합니다!');
  makeCustomer();
  setInterval(spawnCustomer,9000);
};

function updatePlayer(){
  const speed=0.09;
  const forward=new THREE.Vector3(
    -Math.sin(player.yaw),0,-Math.cos(player.yaw)
  );
  const right=new THREE.Vector3(
    Math.cos(player.yaw),0,-Math.sin(player.yaw)
  );

  if(keys.w) player.position.addScaledVector(forward,speed);
  if(keys.s) player.position.addScaledVector(forward,-speed);
  if(keys.a) player.position.addScaledVector(right,-speed);
  if(keys.d) player.position.addScaledVector(right,speed);

  player.position.x=Math.max(-9,Math.min(9,player.position.x));
  player.position.z=Math.max(-9,Math.min(9,player.position.z));

  camera.position.copy(player.position);
  camera.rotation.order='YXZ';
  camera.rotation.y=player.yaw;
  camera.rotation.x=player.pitch;
}

function updateCustomers(){
  for(const c of [...customers]){
    const target=new THREE.Vector3(1,0,-4);

    if(c.state==='enter'){
      c.group.position.z-=0.035;
      if(c.group.position.z< -1){
        c.state='checkout';
        currentCustomer=c;
        say('손님이 도착했습니다! 상품을 스캔하세요.');
      }
    }

    if(c.state==='leave'){
      c.group.position.z+=0.045;
      if(c.group.position.z>10){
        scene.remove(c.group);
        customers=customers.filter(x=>x!==c);
        updateHUD();
      }
    }
  }
}

function animate(){
  requestAnimationFrame(animate);
  if(gameStarted){
    updatePlayer();
    updateCustomers();
  }
  renderer.render(scene,camera);
}

animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
